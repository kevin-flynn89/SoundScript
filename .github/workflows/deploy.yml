name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Generate PNG assets (icone, OG, scorciatoie, screenshot)
        run: |
          set -e
          command -v rsvg-convert >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y librsvg2-bin; }
          mkdir -p dist/icons dist/screenshots

          # Icone iOS/PWA (sempre)
          rsvg-convert -w 180 -h 180 public/icon-light.svg -o dist/icons/apple-touch-180.png
          rsvg-convert -w 192 -h 192 public/icon-light.svg -o dist/icons/icon-192.png
          rsvg-convert -w 512 -h 512 public/icon-light.svg -o dist/icons/icon-512.png
          sed -E 's/rx="[0-9]+"/rx="0"/' public/icon-light.svg > /tmp/icon-maskable.svg
          rsvg-convert -w 512 -h 512 /tmp/icon-maskable.svg -o dist/icons/icon-maskable-512.png

          # Banner Open Graph (solo se presente)
          if [ -f public/og-banner.svg ]; then
            rsvg-convert -w 1200 -h 630 public/og-banner.svg -o dist/icons/og-1200.png
          fi

          # Icone scorciatoie (solo se presenti)
          if [ -f public/shortcut-new.svg ]; then
            rsvg-convert -w 96 -h 96 public/shortcut-new.svg -o dist/icons/shortcut-new.png
          fi
          if [ -f public/shortcut-history.svg ]; then
            rsvg-convert -w 96 -h 96 public/shortcut-history.svg -o dist/icons/shortcut-history.png
          fi

          # Screenshot: segnaposto solo se i PNG reali non esistono
          if [ ! -f public/screenshots/wide-1280x720.png ]; then
            if [ -f public/screen-wide-placeholder.svg ]; then
              rsvg-convert -w 1280 -h 720 public/screen-wide-placeholder.svg -o dist/screenshots/wide-1280x720.png
            fi
          else
            cp public/screenshots/wide-1280x720.png dist/screenshots/
          fi
          if [ ! -f public/screenshots/narrow-540x960.png ]; then
            if [ -f public/screen-narrow-placeholder.svg ]; then
              rsvg-convert -w 540 -h 960 public/screen-narrow-placeholder.svg -o dist/screenshots/narrow-540x960.png
            fi
          else
            cp public/screenshots/narrow-540x960.png dist/screenshots/
          fi

          ls -la dist/icons dist/screenshots

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4