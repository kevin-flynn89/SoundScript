name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Generate PNG icons (iOS/PWA)
        run: |
          set -e
          command -v rsvg-convert >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y librsvg2-bin; }
          mkdir -p dist/icons
          rsvg-convert -w 180 -h 180 public/icon-light.svg -o dist/icons/apple-touch-180.png
          rsvg-convert -w 192 -h 192 public/icon-light.svg -o dist/icons/icon-192.png
          rsvg-convert -w 512 -h 512 public/icon-light.svg -o dist/icons/icon-512.png
          sed -E 's/rx="[0-9]+"/rx="0"/' public/icon-light.svg > /tmp/icon-maskable.svg
          rsvg-convert -w 512 -h 512 /tmp/icon-maskable.svg -o dist/icons/icon-maskable-512.png
          ls -la dist/icons

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4