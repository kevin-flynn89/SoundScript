name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      
      - name: Generate OG banner
        run: |
          mkdir -p dist/icons
          rsvg-convert public/og-banner.svg -w 1200 -o dist/icons/og-1200.png
      
      - name: Generate shortcut icons
        run: |
          rsvg-convert public/shortcut-new.svg -w 96 -o dist/icons/shortcut-new.png
          rsvg-convert public/shortcut-history.svg -w 96 -o dist/icons/shortcut-history.png
      
      - name: Generate screenshots (conditional)
        run: |
          mkdir -p dist/screenshots
          
          # Wide screenshot: genera solo se il PNG non esiste
          if [ ! -f "public/screenshots/wide-1280x720.png" ]; then
            rsvg-convert public/screen-wide-placeholder.svg -w 1280 -o dist/screenshots/wide-1280x720.png
          else
            cp public/screenshots/wide-1280x720.png dist/screenshots/
          fi
          
          # Narrow screenshot: genera solo se il PNG non esiste
          if [ ! -f "public/screenshots/narrow-540x960.png" ]; then
            rsvg-convert public/screen-narrow-placeholder.svg -w 540 -o dist/screenshots/narrow-540x960.png
          else
            cp public/screenshots/narrow-540x960.png dist/screenshots/
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4